[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mocha-python-audit"
version = "1.0.0"
description = "Shared AuditLogger library for Kryptos agents — consistent audit trail across all components"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/mocha_python_audit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
