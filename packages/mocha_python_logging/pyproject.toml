[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mocha-python-logging"
version = "1.0.0"
description = "Shared IntegrationLogger + @log_integration decorator for Kryptos — automatic latency/status logging for all outbound network calls"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/mocha_python_logging"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
